name: Fork test runner

# Manual parallel test runner for the fork. Dispatch it by hand
# against any branch; it never runs on push or pull_request.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Gradle module path, e.g. :solr:core"
        required: true
        default: ":solr:core"
      tests:
        description: "Test class or pattern for the Gradle --tests filter"
        required: true
      gradle_args:
        description: "Extra Gradle arguments (optional)"
        required: false
        default: ""

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused tests
        run: ./gradlew ${{ inputs.module }}:test --tests "${{ inputs.tests }}" ${{ inputs.gradle_args }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
