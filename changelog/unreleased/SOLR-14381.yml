title: Distributed grouped counts are now long values, so grouped searches over more than Integer.MAX_VALUE matching documents no longer overflow. Shards send an Integer whenever a count fits, so an older coordinator keeps working for those counts. SolrJ GroupCommand getMatches() now returns long and getNGroups() returns Long.
type: fixed
authors:
