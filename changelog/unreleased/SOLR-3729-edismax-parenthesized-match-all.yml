title: >
  edismax now treats a parenthesized match-all query such as (*:*), and signed or boosted forms, as match-all instead of a wildcard term on the default field. A *:* inside a larger group, such as (foo *:*), is match-all too, and a negated form such as -*:* excludes every document.
type: fixed
authors:
