tasks.register("checkDevDocsLicenseHeaders") {
  description "Fails if a dev-docs file carries license text; dev-docs is excluded from the source release."
  group "Precommit"

  doLast {
    def offenders = fileTree(file("dev-docs")).files.findAll { devDoc ->
      def head = devDoc.withReader { reader -> (1..40).collect { reader.readLine() ?: '' }.join('\n') }
      (head =~ /(?i)licensed (to|under)|apache license|spdx-license|copyright/).find()
    }
    if (!offenders.isEmpty()) {
      throw new GradleException("License text found in dev-docs, which must stay header-free:\n" +
          offenders.collect { "  " + rootProject.relativePath(it) }.join("\n"))
    }
  }
}

rootProject.tasks.named("precommit").configure {
  dependsOn "checkDevDocsLicenseHeaders"
}
